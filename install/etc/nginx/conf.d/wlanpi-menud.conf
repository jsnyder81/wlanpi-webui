# WebSocket reverse proxy for wlanpi-menud
location /ui/ws {
    auth_request /auth/check;
    auth_request_set $webui_user $upstream_http_x_webui_user;
    auth_request_set $webui_session $upstream_http_x_webui_session;

    error_page 401 = @ws_unauthorized;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;

    proxy_set_header X-WebUI-User $webui_user;
    proxy_set_header X-WebUI-Session $webui_session;

    proxy_pass http://unix:/run/wlanpi-menud/proxy/proxy.sock;
}

location @ws_unauthorized {
    return 401;
}
