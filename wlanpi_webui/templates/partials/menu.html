{# Device menu: a static shell. Everything inside is drawn by static/js/menu/*.js
   from the menu service's frames; this template holds no menu content. #}
<div id="menu-panel" class="page menu-panel uk-flex-1" data-panel="menu">
  <div id="menu-banner" class="menu-banner" hidden></div>
  <a id="menu-statusbar" class="menu-statusbar" href="#" title="Device status. Select to go to Home."></a>
  <div class="menu-header">
    <h1 class="page-title menu-heading">Device menu</h1>
    <div class="menu-header-actions">
      <div id="menu-activity" class="menu-activity" hidden></div>
      <button id="menu-panel-toggle" type="button" class="uk-button uk-button-default uk-button-small menu-ctl"
        data-menu-action="panel-toggle" aria-pressed="false" aria-controls="menu-front-panel">Front panel</button>
    </div>
  </div>
  <div id="menu-notices" class="menu-notices" aria-live="polite" hidden></div>
  <div class="menu-layout">
    <nav id="menu-sidebar" class="menu-sidebar" aria-label="Device menu"></nav>
    <section id="menu-page" class="menu-page">
      <div class="menu-connecting" role="status"><span class="menu-spinner" aria-hidden="true"></span> Connecting to the device menu…</div>
    </section>
    <aside id="menu-front-panel" class="menu-fp" hidden></aside>
  </div>
  <div id="menu-dialog"></div>
  <div id="menu-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <div class="uk-alert uk-alert-warning">The device menu needs JavaScript.</div>
  </noscript>
</div>
